<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>GTA Vice City</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #080510;
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .card {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            backdrop-filter: blur(40px);
            max-width: 420px;
        }
        h1 {
            font-size: 26px;
            background: linear-gradient(135deg, #ff6b35, #ffaa5c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        p {
            color: rgba(255,255,255,0.55);
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.5;
        }
        .link-box {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 16px;
            word-break: break-all;
        }
        .link-box a {
            color: #ff8c42;
            text-decoration: none;
            font-size: 14px;
        }
        .sub {
            color: rgba(255,255,255,0.3);
            font-size: 11px;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Grand Theft Auto: Vice City</h1>
        <p>Copy the link below and open it in your browser to play.</p>
        <div class="link-box">
            <a href="https://gta-revc.vercel.app" target="_blank">gta-revc.vercel.app</a>
        </div>
        <div class="sub">Compiled by Forever4D &bull; revcDOS</div>
    </div>
</body>
</html>
